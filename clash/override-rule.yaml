# Clash Party YAML 覆写
# 覆写代理组和分流规则，保留订阅节点、订阅提供器与 DNS 设置
# 与 override-rule.js 二选一使用

mode: rule
ipv6: true
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: null

# === 节点分组 ===
proxy-groups:

  # --- 基础出口 ---
  - name: 🎛️ 手动选择
    type: select
    proxies: [🖥️ 自建节点, 🚅 节点优选, ➡️ 全球直连]
    include-all: true
  - name: 🧭 日常代理
    type: select
    proxies: [🖥️ 自建节点, 🚅 节点优选, 🎛️ 手动选择, 🗺️ 亚洲优选]
    include-all: true
  - name: ➡️ 全球直连
    type: select
    proxies: [DIRECT]

  # --- 节点池 ---
  - name: 🛜 家庭内网
    type: select
    proxies: [➡️ 全球直连]
    include-all: true
    filter: (?i)(?:wireguard|wg|回家|home|路由器|内网|家庭)
  - name: 🖥️ 自建节点
    type: select
    include-all: true
    filter: (?i)^(?!.*(?:wireguard|wg|回家|home|路由器|内网|家庭)).*us-?[a-z](?:[|]|-vless)
    empty-fallback: REJECT
  - name: 🗽 美国优选
    type: url-test
    include-all: true
    filter: (?=.*(🇺🇸|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|纽约|纽纽|亚特兰大|迈阿密|华盛顿|\bUS(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|United States|USA|America|JFK|EWR|IAD|ATL|ORD|MIA|NYC|LAX|SFO|SEA|DFW|SJC))
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 30
    lazy: true
  - name: 🗺️ 亚洲优选
    type: url-test
    include-all: true
    filter: (?i)^(?!.*(?:wireguard|wg|回家|home|路由器|内网|家庭)).*(?:🇯🇵|🇰🇷|🇸🇬|🇭🇰|🇹🇼|日本|东京|東京|大阪|韩国|韓國|首尔|首爾|新加坡|狮城|獅城|香港|台湾|臺灣|台灣|台北|臺北|Japan|Tokyo|Osaka|Korea|Seoul|Singapore|Hong[ _-]?Kong|Taiwan|Taipei|(?<![a-z])(?:JP|KR|SG|HK|TW|NRT|HND|KIX|ICN|SIN|HKG|TPE)(?![a-z]))
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 30
    lazy: true
    empty-fallback: REJECT
  - name: 🚅 节点优选
    type: url-test
    include-all: true
    filter: (?i)^(?!.*(?:us-?[a-z](?:[|]|-vless)|wireguard|wg|回家|home|路由器|内网|家庭)).*
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 30
    lazy: true
    empty-fallback: REJECT
  # AI 优选默认走自建，也可手动切换到订阅中的任意节点
  - name: 🧠 AI优选
    type: select
    proxies: [🖥️ 自建节点, 🎛️ 手动选择]
    include-all: true

  # --- 应用策略 ---
  - name: ✨ AI服务
    type: select
    proxies: [🧠 AI优选, 🎛️ 手动选择]
    include-all: true
  - name: 📦 开发下载
    type: select
    proxies: [🧭 日常代理, 🎛️ 手动选择, ➡️ 全球直连]
    include-all: true
  - name: 🐙 GitHub
    type: select
    proxies: [🎛️ 手动选择, 🧭 日常代理, ➡️ 全球直连]
    include-all: true
  - name: 🪟 微软服务
    type: select
    proxies: [➡️ 全球直连, 🎛️ 手动选择, 🖥️ 自建节点, 🗽 美国优选]
  - name: 🍏 苹果服务
    type: select
    proxies: [➡️ 全球直连, 🎛️ 手动选择, 🖥️ 自建节点, 🗽 美国优选]
  - name: ☁️ OneDrive
    type: select
    proxies: [➡️ 全球直连, 🎛️ 手动选择, 🖥️ 自建节点, 🗽 美国优选]
  - name: 🔎 谷歌服务
    type: select
    proxies: [🗽 美国优选, 🧭 日常代理, 🎛️ 手动选择]
    include-all: true
  - name: 🔔 谷歌FCM
    type: select
    proxies: [🗽 美国优选, 🧭 日常代理, 🎛️ 手动选择]
    include-all: true
  - name: 💰 PayPal
    type: select
    proxies: [🎛️ 手动选择, 🖥️ 自建节点, 🗽 美国优选, ➡️ 全球直连]
  - name: 🛍️ 国外电商
    type: select
    proxies: [🎛️ 手动选择, 🖥️ 自建节点, 🗽 美国优选]

  # --- 流媒体、社交与 PT ---
  - name: 🍿 媒体解锁
    type: select
    proxies: [🗺️ 亚洲优选, 🚅 节点优选, 🗽 美国优选, 🖥️ 自建节点, 🎛️ 手动选择]
  - name: 🗨️ 聊天社交
    type: select
    proxies: [🗺️ 亚洲优选, 🚅 节点优选, 🗽 美国优选, 🖥️ 自建节点, 🎛️ 手动选择]
  - name: 🧲 PT站点
    type: select
    proxies: [➡️ 全球直连, 🚅 节点优选, 🗽 美国优选, 🖥️ 自建节点, 🎛️ 手动选择]

  # --- GFW 代理 ---
  - name: 🔓 GFW
    type: select
    proxies: [🗺️ 亚洲优选, 🚅 节点优选, 🗽 美国优选, 🖥️ 自建节点, 🎛️ 手动选择]

  # --- 游戏与测速 ---
  - name: 🧩 游戏平台
    type: select
    proxies: [➡️ 全球直连, 🚅 节点优选, 🗽 美国优选, 🖥️ 自建节点, 🎛️ 手动选择]
  - name: 🕹️ Steam
    type: select
    proxies: [➡️ 全球直连, 🚅 节点优选, 🗽 美国优选, 🖥️ 自建节点, 🎛️ 手动选择]
  - name: ⏱️ 测速工具
    type: select
    proxies: [➡️ 全球直连, 🎛️ 手动选择, 🚅 节点优选, 🖥️ 自建节点, 🗽 美国优选]

  # --- 兜底出口 ---
  - name: 🔌 非标端口
    type: select
    proxies: [📥 漏网之鱼, ➡️ 全球直连, 🎛️ 手动选择]
  - name: 📥 漏网之鱼
    type: select
    proxies: [➡️ 全球直连, 🚅 节点优选, 🎛️ 手动选择, 🖥️ 自建节点, 🗽 美国优选]

# === 规则源 ===
# 远程规则与 template_online.ini 及 override-rule.js 共用
