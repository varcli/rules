    behavior: classical
    format: text
    url: https://ghfast.top/https://raw.githubusercontent.com/varcli/rules/main/Custom_Direct.list
    path: ./ruleset/varcli-override/custom-direct.list
    interval: 86400
  varcli-custom-proxy:
    type: http
    behavior: classical
    format: text
    url: https://ghfast.top/https://raw.githubusercontent.com/varcli/rules/main/Custom_Proxy.list
    path: ./ruleset/varcli-override/custom-proxy.list
    interval: 86400
  varcli-custom-ai:
    type: http
    behavior: classical
