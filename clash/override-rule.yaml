# === 分流规则 ===
# 规则按顺序匹配，最先命中的规则决定出口
rules:

  # --- 家庭内网与自定义规则 ---
  - "IP-CIDR,172.30.123.0/24,🛜 家庭内网,no-resolve"
  - "IP-CIDR,192.168.123.0/24,🛜 家庭内网,no-resolve"
  - "GEOSITE,private,➡️ 全球直连"
  - "GEOIP,private,➡️ 全球直连,no-resolve"
