# ==================== 规则集 ====================
rule-providers:

  # 自定义规则
  custom_direct:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: https://ghfast.top/https://raw.githubusercontent.com/varcli/rules/main/Custom_Direct.list
    path: ./ruleset/custom_direct.list

  custom_proxy:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: https://ghfast.top/https://raw.githubusercontent.com/varcli/rules/main/Custom_Proxy.list
    path: ./ruleset/custom_proxy.list

  custom_developer:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: https://ghfast.top/https://raw.githubusercontent.com/varcli/rules/main/Custom_Developer.list
    path: ./ruleset/custom_developer.list

  # AI 精细分流（VPSDance）
  ai_coding:
    type: http
    behavior: classical
    format: yaml
    interval: 28800
    url: https://ghfast.top/https://raw.githubusercontent.com/VPSDance/ai-proxy-rules/main/rules/clash/coding.yaml
    path: ./ruleset/ai_coding.yaml

  ai_model:
    type: http
    behavior: classical
    format: yaml
    interval: 28800
    url: https://ghfast.top/https://raw.githubusercontent.com/VPSDance/ai-proxy-rules/main/rules/clash/model.yaml
    path: ./ruleset/ai_model.yaml

  ai_media:
    type: http
    behavior: classical
    format: yaml
    interval: 28800
    url: https://ghfast.top/https://raw.githubusercontent.com/VPSDance/ai-proxy-rules/main/rules/clash/media.yaml
    path: ./ruleset/ai_media.yaml

  # 广告
  ban_ad:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
    path: ./ruleset/ban_ad.list

  # GFW
  proxy_gfw:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list
    path: ./ruleset/proxy_gfw.list

  # 中国相关
  china_domain:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
    path: ./ruleset/china_domain.list

  china_ip:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaIp.list
    path: ./ruleset/china_ip.list

  china_company_ip:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
    path: ./ruleset/china_company_ip.list

  download:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list
    path: ./ruleset/download.list

# ==================== 规则 ====================
rules:
  # 局域网
  - GEOSITE,private,🎯 全球直连
  - GEOIP,private,🎯 全球直连,no-resolve

  # 自定义优先
  - RULE-SET,custom_direct,🎯 全球直连
  - RULE-SET,custom_proxy,🚀 手动选择

  # Cloudflare 优先（避免 Turnstile 被广告误杀）
  - GEOSITE,cloudflare,👨‍💻 开发专属

  # 广告拦截
  - GEOSITE,category-ads-all,🛑 广告拦截
