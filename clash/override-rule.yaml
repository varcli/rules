# Clash Party Override · 规则

mode: rule
ipv6: true
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

# ==================== DNS ====================
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - geosite:private
    - geosite:cn
    - geosite:apple-cn
    - +.lan
    - +.local
    - +.localhost
  default-nameserver:
    - 223.5.5.5
    - 1.1.1.1
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://1.1.1.1/dns-query

# ==================== 策略组 ====================
proxy-groups:

  # ---------- 总控 ----------
  - name: 🚀 手动选择
    type: select
    proxies:
      - 🏠 自建美国
      - 🇺🇸 美国优选
      - ⚡ 节点优选
      - DIRECT

  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 手动选择

  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  # ---------- 物理节点池 ----------
  - name: 🏠 自建美国
    type: fallback
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 50
    lazy: true
    filter: "(?i)us-?[a-z]([|]|-vless)"
    include-all: true

  - name: 🇺🇸 美国优选
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 50
    lazy: true
    filter: "(?=.*(🇺🇸|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|纽约|纽纽|亚特兰大|迈阿密|华盛顿|\\bUS(?:[-_ ]?\\d+(?:[-_ ]?[A-Za-z]{2,})?)?\\b|United States|USA|America|JFK|EWR|IAD|ATL|ORD|MIA|NYC|LAX|SFO|SEA|DFW|SJC))"
    include-all: true

  - name: ⚡ 节点优选
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 50
    lazy: true
    filter: "(?!.*(?i)us-?[a-z]([|]|-vless))"
    include-all: true

  # ---------- 生产力系列 ----------
  - name: 🧑‍💻 AI编程
    type: fallback
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    proxies: [🚀 手动选择, 🏠 自建美国, 🇺🇸 美国优选]

  - name: 🤖 AI模型
    type: fallback
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    proxies: [🚀 手动选择, 🏠 自建美国, 🇺🇸 美国优选]

  - name: 🎨 AI媒体
    type: fallback
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    proxies: [⚡ 节点优选, 🇺🇸 美国优选, 🏠 自建美国, 🚀 手动选择]

  - name: 👨‍💻 开发专属
    type: fallback
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    proxies: [🚀 手动选择, 🏠 自建美国, 🇺🇸 美国优选, 🎯 全球直连]

  - name: 🚀 GitHub
    type: fallback
