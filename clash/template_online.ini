ruleset=📥 漏网之鱼,[]FINAL

; === 节点分组 ===
; select 分组默认使用首项

; --- 基础出口 ---
custom_proxy_group=🎛️ 手动选择`select`[]🖥️ 自建节点`[]🚅 节点优选`[]➡️ 全球直连`.*
custom_proxy_group=🧭 日常代理`select`[]🖥️ 自建节点`[]🚅 节点优选`[]🎛️ 手动选择`[]🗺️ 亚洲优选`.*
custom_proxy_group=➡️ 全球直连`select`[]DIRECT
; custom_proxy_group=🚫 广告拦截`select`[]REJECT

; --- 节点池 ---

; 家庭内网默认直连，可手动选择按名称匹配的回家节点
custom_proxy_group=🛜 家庭内网`select`[]➡️ 全球直连`(?i)(wireguard|wg|回家|home|路由器|内网|家庭)

; 自建节点沿用现有命名规则，排除回家节点
custom_proxy_group=🖥️ 自建节点`select`(?i)^(?!.*(?:wireguard|wg|回家|home|路由器|内网|家庭)).*us-?[a-z](?:[|]|-vless)`[]REJECT

; 美国优选在匹配的美国节点中自动测速，包含自建节点
custom_proxy_group=🗽 美国优选`url-test`(?i)(🇺🇸|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|纽约|纽瓦克|亚特兰大|迈阿密|华盛顿|\bUS(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|United States|USA|America|JFK|EWR|IAD|ATL|ORD|MIA|NYC|LAX|SFO|SEA|DFW|SJC)`http://cp.cloudflare.com/generate_204`600,,30

; 亚洲优选覆盖日本、韩国、新加坡、香港和台湾，排除回家节点
custom_proxy_group=🗺️ 亚洲优选`url-test`(?i)^(?!.*(?:wireguard|wg|回家|home|路由器|内网|家庭)).*(?:🇯🇵|🇰🇷|🇸🇬|🇭🇰|🇹🇼|日本|东京|東京|大阪|韩国|韓國|首尔|首爾|新加坡|狮城|獅城|香港|台湾|台灣|臺灣|台北|臺北|Japan|Tokyo|Osaka|Korea|Seoul|Singapore|Hong[ _-]?Kong|Taiwan|Taipei|\b(?:JP|KR|SG|HK|TW|NRT|HND|KIX|ICN|SIN|HKG|TPE)\b)`http://cp.cloudflare.com/generate_204`600,,30

; 节点优选自动测速，仅排除回家节点（包含自建节点）
custom_proxy_group=🚅 节点优选`url-test`(?i)^(?!.*(?:wireguard|wg|回家|home|路由器|内网|家庭))(?:.+)`http://cp.cloudflare.com/generate_204`600,,30

; AI 优选默认走自建，带 [AI] 或 AI解锁 的备用节点优先显示
custom_proxy_group=🧠 AI优选`select`[]🖥️ 自建节点`(?i)^(?!.*(?:wireguard|wg|回家|home|路由器|内网|家庭)).*(?:\[AI\]|AI解锁)`[]🎛️ 手动选择`.*

; --- 应用策略 ---
custom_proxy_group=✨ AI服务`select`[]🧠 AI优选`[]🎛️ 手动选择`.*
custom_proxy_group=📦 开发下载`select`[]🧭 日常代理`[]🎛️ 手动选择`[]➡️ 全球直连`.*
custom_proxy_group=🐙 GitHub`select`[]🎛️ 手动选择`[]🧭 日常代理`[]➡️ 全球直连`.*
custom_proxy_group=🪟 微软服务`select`[]➡️ 全球直连`[]🎛️ 手动选择`[]🖥️ 自建节点`[]🗽 美国优选
custom_proxy_group=🍏 苹果服务`select`[]➡️ 全球直连`[]🎛️ 手动选择`[]🖥️ 自建节点`[]🗽 美国优选
custom_proxy_group=☁️ OneDrive`select`[]➡️ 全球直连`[]🎛️ 手动选择`[]🖥️ 自建节点`[]🗽 美国优选
custom_proxy_group=🔎 谷歌服务`select`[]🗽 美国优选`[]🧭 日常代理`[]🎛️ 手动选择`.*
custom_proxy_group=🔔 谷歌FCM`select`[]🗽 美国优选`[]🧭 日常代理`[]🎛️ 手动选择`.*
custom_proxy_group=💰 PayPal`select`[]🎛️ 手动选择`[]🖥️ 自建节点`[]🗽 美国优选`[]➡️ 全球直连
custom_proxy_group=🛍️ 国外电商`select`[]🎛️ 手动选择`[]🖥️ 自建节点`[]🗽 美国优选

; --- 流媒体、社交与 PT ---
