ruleset=🧲 PT站点,[]GEOSITE,category-pt

; --- GFW 代理兜底 ---
ruleset=🔓 GFW,https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list
ruleset=🔓 GFW,[]GEOSITE,gfw

; --- 下载器与国内通用直连 ---
ruleset=➡️ 全球直连,https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list
