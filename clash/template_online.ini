; === 分流规则 ===
; 规则按顺序匹配，最先命中的规则决定出口

; --- 家庭内网 ---
; 指定网段优先匹配，避免被通用局域网直连覆盖
ruleset=🛜 家庭内网,[]IP-CIDR,172.30.123.0/24,no-resolve
ruleset=🛜 家庭内网,[]IP-CIDR,192.168.123.0/24,no-resolve

; --- 本地与局域网 ---
ruleset=➡️ 全球直连,[]GEOSITE,private
ruleset=➡️ 全球直连,[]GEOIP,private,no-resolve

; --- 自定义直连与代理 ---
ruleset=➡️ 全球直连,https://ghfast.top/https://raw.githubusercontent.com/varcli/rules/main/Custom_Direct.list
ruleset=🎛️ 手动选择,https://ghfast.top/https://raw.githubusercontent.com/varcli/rules/main/Custom_Proxy.list

; --- 广告拦截（默认关闭） ---
