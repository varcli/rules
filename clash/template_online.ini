custom_proxy_group=🕹️ Steam`select`[]➡️ 全球直连`[]🚅 节点优选`[]🗽 美国优选`[]🖥️ 自建节点`[]🎛️ 手动选择
custom_proxy_group=⏱️ 测速工具`select`[]➡️ 全球直连`[]🎛️ 手动选择`[]🚅 节点优选`[]🖥️ 自建节点`[]🗽 美国优选

; --- 兜底出口 ---
custom_proxy_group=🔌 非标端口`select`[]📥 漏网之鱼`[]➡️ 全球直连`[]🎛️ 手动选择
custom_proxy_group=📥 漏网之鱼`select`[]➡️ 全球直连`[]🚅 节点优选`[]🎛️ 手动选择`[]🖥️ 自建节点`[]🗽 美国优选

