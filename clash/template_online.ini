ruleset=🗨️ 聊天社交,[]GEOIP,telegram,no-resolve
ruleset=🗨️ 聊天社交,[]GEOSITE,whatsapp
ruleset=🗨️ 聊天社交,[]GEOSITE,discord
ruleset=🗨️ 聊天社交,[]GEOSITE,talkatone
ruleset=🗨️ 聊天社交,[]GEOSITE,twitter
ruleset=🗨️ 聊天社交,[]GEOIP,twitter,no-resolve
ruleset=🗨️ 聊天社交,[]GEOSITE,reddit

